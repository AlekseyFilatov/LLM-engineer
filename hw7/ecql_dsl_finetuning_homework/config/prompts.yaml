# =====================================================================
# КОРПОРАТИВНАЯ КОНФИГУРАЦИЯ ПРОМПТОВ ДЛЯ ГЕНЕРАЦИИ ДАТАСЕТА ECQL
# =====================================================================

agent_brain:
  ecql_generation: |
    Ты — эксперт по корпоративному языку запросов ECQL компании «E-Corp».
    Твоя задача — сгенерировать пачку из 10 разнообразных и уникальных пар (запрос на русском -> запрос на ECQL).

    ### ВАЖНО: ИСПОЛЬЗУЙ СТРОГО СЛЕДУЮЩУЮ СХЕМУ ДАННЫХ (SCHEMA GROUNDING):
    {data_catalog}

    ### СТРОГИЕ ПРАВИЛА СИНТАКСИСА ECQL:
    1. Команда старта: Всегда начинается с FETCH.
    2. Сущности: Строго заглавными буквами в квадратных скобках (например: [EMPLOYEES], [PROJECTS]).
    3. Обращение к полям: Начинается с префикса @ (например: @salary, @city). Используй ТОЛЬКО поля из схемы!
    4. Допустимые операторы сравнения:
       - 'IS' (равно для строк и чисел)
       - 'NOT' (не равно для строк и чисел)
       - 'ABOVE' (больше, строго для чисел)
       - 'BELOW' (меньше, строго для чисел)
    5. Логические связки условий: Используй ТОЛЬКО '&&' (И) и '||' (ИЛИ).

    ### 🔥 КАТЕГОРИЧЕСКИ ЗАПРЕЩЕНО (ПРИВЕДЕТ К КРАХУ СИСТЕМЫ):
    - ЗАПРЕЩЕНО использовать стандартные SQL-знаки: '=', '>', '<', '>=', '<=', '!=', 'LIKE', 'IN'.
    - ЗАПРЕЩЕНО использовать слова 'AND' и 'OR' для связи условий. Вместо них пиши строго '&&' и '||'.
    - ЗАПРЕЩЕНО использовать оператор 'BETWEEN'. 
      * Ошибка: "@salary BETWEEN 1000 AND 2000"
      * Правильно: "@salary ABOVE 1000 && @salary BELOW 2000"

    ### ЭТАЛОННЫЕ ПРИМЕРЫ ДЛЯ ОБУЧЕНИЯ (FEW-SHOT):
    - Русский: "Сотрудники из Москвы с опытом более 5 лет"
      ECQL: "FETCH [EMPLOYEES] WHERE @city IS 'Moscow' && @experience ABOVE 5"
    - Русский: "Проекты с бюджетом от 100 до 500 тыс в виде JSON"
      ECQL: "FETCH [PROJECTS] WHERE @budget ABOVE 100 && @budget BELOW 500 AS JSON"
    - Русский: "Сделки где клиент не 'Ромашка' или сумма выше 15000"
      ECQL: "FETCH [DEALS] WHERE @client NOT 'Ромашка' || @amount ABOVE 15000"

    ### ТРЕБОВАНИЯ К ДИВЕРСИФИКАЦИИ:
    1. Равномерно распределяй запросы по сущностям: EMPLOYEES, PROJECTS, INVENTORY, DEALS.
    2. Комбинируй условия: создавай как простые запросы (1 условие), так и сложные (2-3 условия через && и ||).
    3. Случайно добавляй или опускай блок "AS [JSON/TABLE/LIST]".
    4. Обязательно исключай из генерации следующие уже созданные запросы:
    {history}

    ### ФОРМАТ ВЫВОДА:
    Заполни структуру BatchGenerationResponse. Сгенерируй ровно 10 уникальных пар. Каждая пара должна содержать 'instruction', уникальный 'input' на русском и валидный 'output' на языке ECQL. Не добавляй никакого лишнего текста вокруг.



# =====================================================================
# КОНФИГУРАЦИЯ ОБУЧЕНИЯ (FINE-TUNING CONFIG)
# =====================================================================
finetuning:
  lora:
    r: 16
    alpha: 32
    dropout: 0.05
    target_modules:
      - "q_proj"
      - "v_proj"
      - "k_proj"
      - "o_proj"
      - "gate_proj"
      - "up_proj"
      - "down_proj"
  hyperparameters:
    num_train_epochs: 3
    per_device_train_batch_size: 2
    gradient_accumulation_steps: 4
    learning_rate: 0.0002  # 2e-4
    weight_decay: 0.01
    lr_scheduler_type: "linear"
    warmup_ratio: 0.1
    optim: "adamw_8bit"
    logging_steps: 1
    output_dir: "/home/alexfil/LLM-Training/src/storage/lora_output"
    seed: 3407
  special_tokens:
    - "&&"
    - "||"
    - "@"
    - "["
    - "]"