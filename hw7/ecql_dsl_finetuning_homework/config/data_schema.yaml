entities:
  EMPLOYEES:
    description: "База данных персонала и сотрудников"
    fields:
      "@name": "Строка. ФИО, имя или фамилия сотрудника компании"
      "@salary": "Число. Заработная плата. Для диапазонов используйте ТОЛЬКО ABOVE и BELOW (например: @salary ABOVE 5000 && @salary BELOW 10000). Оператор BETWEEN — ЗАПРЕЩЕН."
      "@city": "Строка. Город проживания. Формат строго: @city 'Название' (например: @city 'Moscow'). Использовать знаки равенства или IN — ЗАПРЕЩЕНО."
      "@status": "Строка. Рабочий статус. Допустимые значения: 'Active', 'On_Leave', 'Fired'."
      "@experience": "Число. Стаж работы в годах. Для диапазонов пишите: @experience ABOVE 3 && @experience BELOW 7."

  PROJECTS:
    description: "Корпоративные проекты и стартапы"
    fields:
      "@budget": "Число. Бюджет проекта, финансирование. Запрещено использовать слово AND для диапазонов."
      "@status": "Строка. Статус разработки. Допустимые значения: 'Planning', 'In_Progress', 'Completed'."
      "@deadline": "Число. Год сдачи проекта (например: 2024, 2025). Для фильтрации лет используйте ABOVE/BELOW или IS."
      "@team_size": "Число. Количество человек в команде."

  INVENTORY:
    description: "Складской учет и оборудование компании"
    fields:
      "@quantity": "Число. Количество товара, остаток на складе."
      "@amount": "Число. Стоимость единицы оборудования, цена."
      "@sku": "Строка. Уникальный артикул или идентификатор товара."
      "@category": "Строка. Категория. Допустимые значения ТОЛЬКО: 'Hardware', 'Software', 'Furniture'."

  DEALS:
    description: "Коммерческие сделки и контракты с клиентами"
    fields:
      "@amount": "Число. Сумма сделки, объем контракта."
      "@stage": "Строка. Этап воронки. Допустимые значения: 'Lead', 'Negotiation', 'Closed_Won', 'Closed_Lost'."
      "@client": "Строка. Название компании-клиента или контрагента."
